name: Deploy Approved Infrastructure

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Validated Self-Service infrastructure request
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.request.outputs.platform }}
      subscription_id: ${{ steps.request.outputs.subscription_id }}
    steps:
      - name: Validate request envelope
        id: request
        shell: bash
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          r=json.loads(os.environ['REQUEST_JSON'])
          required=['platform','serviceType','environment','location','parameters','target']
          missing=[x for x in required if x not in r]
          if missing: raise SystemExit(f'Missing request fields: {missing}')
          platform=r['platform']
          if platform not in {'azure','aws','gcp','azure-local','hyperv'}: raise SystemExit(f'Unsupported platform: {platform}')
          print(f'platform={platform}')
          print(f"subscription_id={(r.get('target') or {}).get('subscriptionId','')}")
          PY

  deploy-azure:
    needs: prepare
    if: needs.prepare.outputs.platform == 'azure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login using workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ needs.prepare.outputs.subscription_id }}
      - name: Validate approved Azure Bicep modules
        shell: bash
        run: |
          for file in iac/azure/modules/*/main.bicep; do
            echo "Building $file"
            az bicep build --file "$file" --stdout > /dev/null
          done
      - name: Deploy approved Azure module
        shell: bash
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: python3 iac/scripts/deploy.py

  unsupported-platform:
    needs: prepare
    if: needs.prepare.outputs.platform != 'azure'
    runs-on: ubuntu-latest
    steps:
      - name: Platform adapter not enabled yet
        run: |
          echo "Platform ${{ needs.prepare.outputs.platform }} is registered but not enabled yet."
          exit 1
