name: Deploy Backstage to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  NODE_VERSION: "24"
  BACKSTAGE_DIR: "backstage"
  AZURE_WEBAPP_NAME: "backstage-pranab-mvp"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: backstage/yarn.lock

      - name: Install Backstage dependencies
        working-directory: ${{ env.BACKSTAGE_DIR }}
        run: yarn install --immutable

      - name: Build Backstage production bundle
        working-directory: ${{ env.BACKSTAGE_DIR }}
        run: yarn build:backend

      - name: Prepare production deployment
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${{ runner.temp }}/backstage-deploy"
          mkdir -p "${{ runner.temp }}/backstage-deploy"

          tar -xzf backstage/packages/backend/dist/bundle.tar.gz             -C "${{ runner.temp }}/backstage-deploy"

          cp backstage/app-config.yaml             "${{ runner.temp }}/backstage-deploy/app-config.yaml"

          cp backstage/app-config.production.appservice.yaml             "${{ runner.temp }}/backstage-deploy/app-config.production.appservice.yaml"

          mkdir -p "${{ runner.temp }}/backstage-deploy/deploy"
          cp backstage/deploy/startup.sh             "${{ runner.temp }}/backstage-deploy/deploy/startup.sh"
          chmod +x "${{ runner.temp }}/backstage-deploy/deploy/startup.sh"

          mkdir -p "${{ runner.temp }}/backstage-deploy/examples/infrastructure-template"
          cp backstage/examples/infrastructure-template/template.yaml             "${{ runner.temp }}/backstage-deploy/examples/infrastructure-template/template.yaml"

          cd "${{ runner.temp }}/backstage-deploy"
          corepack enable
          yarn install --immutable

          # Replace the bundle root start script with the App Service startup command.
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = 'bash deploy/startup.sh';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          zip -qr "${{ github.workspace }}/backstage-appservice.zip" .

      - name: Deploy Backstage to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BB60165ACCCD4F3EB8AD10FD8D3BF808 }}
          package: backstage-appservice.zip
