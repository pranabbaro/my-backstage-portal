name: Build and Deploy Backstage Self-Service V9

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  AZURE_WEBAPP_NAME: "backstage-pranab-mvp"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable

      - name: Remove stale Self-Service files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf backstage/packages/backend/src/selfService
          rm -f backstage/packages/backend/src/selfServicePlugin.ts

          rm -rf overlay/backend/selfService/services/appService
          rm -rf overlay/backend/selfService/services/storageAccount
          rm -rf overlay/backend/selfService/services/virtualMachine
          rm -rf overlay/backend/selfService/discovery/network
          rm -rf overlay/backend/selfService/discovery/resourceGroups
          rm -f overlay/backend/selfService/validation.ts

          echo "Remaining V8 overlay files:"
          find overlay/backend/selfService -maxdepth 3 -type f | sort

      - name: Apply V9 Self-Service source
        run: python3 scripts/prepare_self_service_v8.py

      - name: Verify no legacy Self-Service TypeScript remains
        shell: bash
        run: |
          set -euo pipefail

          if [ -d backstage/packages/backend/src/selfService/services/appService ] ||              [ -d backstage/packages/backend/src/selfService/services/storageAccount ] ||              [ -d backstage/packages/backend/src/selfService/services/virtualMachine ]; then
            echo "ERROR: legacy nested services directory still exists"
            find backstage/packages/backend/src/selfService/services -type f || true
            exit 1
          fi

          test -f backstage/packages/backend/src/selfService/services/storageAccount.ts
          test -f backstage/packages/backend/src/selfService/services/appService.ts
          echo "V10 resource service modules present."

          if [ -d backstage/packages/backend/src/selfService/discovery/network ]; then
            echo "ERROR: legacy discovery/network directory still exists"
            exit 1
          fi

          if [ -f backstage/packages/backend/src/selfService/validation.ts ]; then
            echo "ERROR: legacy validation.ts still exists"
            exit 1
          fi

          if grep -R "subscriptionId.*from.*config" backstage/packages/backend/src/selfService; then
            echo "ERROR: legacy subscriptionId config import detected"
            exit 1
          fi

          echo "V8.1 Self-Service backend layout verified."

          if grep -q "JsonRecord" backstage/packages/backend/src/selfService/azureClient.ts; then
            if ! grep -q "export type JsonRecord" backstage/packages/backend/src/selfService/types.ts; then
              echo "ERROR: JsonRecord is imported by azureClient.ts but not exported by types.ts"
              exit 1
            fi
          fi

          if ! grep -q "SelfServiceLogger" backstage/packages/backend/src/selfService/types.ts; then
            echo "ERROR: SelfServiceLogger is missing from types.ts"
            exit 1
          fi

          echo "V9 shared type contract verified."

      - name: Force safe runtime configuration
        shell: bash
        run: |
          cat > backstage/app-config.production.yaml <<'EOF'
          app:
            title: Enterprise Developer Portal
            baseUrl: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
            packages: all
            extensions:
              - page:catalog:
                  config:
                    path: /
          organization:
            name: Enterprise Platform
          backend:
            baseUrl: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
            listen:
              host: 0.0.0.0
              port: ${PORT}
            cors:
              origin: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
              methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
              credentials: true
          auth:
            environment: production
            providers:
              guest:
                dangerouslyAllowOutsideDevelopment: true
          EOF
          if grep -R "filename:" backstage/app-config*.yaml; then exit 1; fi

      - name: Install dependencies
        working-directory: backstage
        run: yarn install --no-immutable

      - name: Type check
        working-directory: backstage
        run: yarn tsc

      - name: Build
        working-directory: backstage
        env:
          NODE_ENV: production
        run: yarn build:backend

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="${{ runner.temp }}/backstage-deploy"
          ZIP="${{ github.workspace }}/backstage-appservice.zip"
          rm -rf "$DEPLOY" "$ZIP"
          mkdir -p "$DEPLOY"
          cp backstage/package.json backstage/yarn.lock "$DEPLOY/"
          [ -f backstage/.yarnrc.yml ] && cp backstage/.yarnrc.yml "$DEPLOY/" || true
          [ -f backstage/backstage.json ] && cp backstage/backstage.json "$DEPLOY/" || true
          [ -d backstage/.yarn ] && cp -R backstage/.yarn "$DEPLOY/.yarn" || true
          tar -xzf backstage/packages/backend/dist/skeleton.tar.gz -C "$DEPLOY"
          cd "$DEPLOY"
          corepack enable
          yarn workspaces focus --all --production
          tar -xzf "${{ github.workspace }}/backstage/packages/backend/dist/bundle.tar.gz" -C "$DEPLOY"
          cp "${{ github.workspace }}/backstage/app-config.yaml" "$DEPLOY/app-config.yaml"
          cp "${{ github.workspace }}/backstage/app-config.production.yaml" "$DEPLOY/app-config.production.yaml"
          [ -d "${{ github.workspace }}/backstage/examples" ] && cp -R "${{ github.workspace }}/backstage/examples" "$DEPLOY/examples" || true
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts=pkg.scripts||{};
          pkg.scripts.start='node packages/backend --config app-config.yaml --config app-config.production.yaml';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          zip -qr "$ZIP" .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "${{ env.AZURE_WEBAPP_NAME }}"
          slot-name: "Production"
          package: backstage-appservice.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BB60165ACCCD4F3EB8AD10FD8D3BF808 }}
