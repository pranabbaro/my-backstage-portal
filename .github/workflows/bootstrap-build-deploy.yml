name: Build and Deploy Backstage Recovery

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  AZURE_WEBAPP_NAME: "backstage-pranab-mvp"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare clean Backstage recovery build
        run: python3 scripts/prepare_recovery.py

      - name: Force safe runtime configuration
        shell: bash
        run: |
          cat > backstage/app-config.yaml <<'EOF'
          app:
            title: Enterprise Developer Portal
            baseUrl: http://localhost:3000
            packages: all
            extensions:
              - page:catalog:
                  config:
                    path: /

          organization:
            name: Enterprise Platform

          auth:
            environment: development
            providers:
              guest: {}

          catalog:
            rules:
              - allow: [Component, System, API, Resource, Location, Template]
            locations:
              - type: file
                target: ./examples/infrastructure-template/template.yaml
                rules:
                  - allow: [Template]
          EOF

          cat > backstage/app-config.production.yaml <<'EOF'
          app:
            title: Enterprise Developer Portal
            baseUrl: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
            packages: all
            extensions:
              - page:catalog:
                  config:
                    path: /

          organization:
            name: Enterprise Platform

          backend:
            baseUrl: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
            listen:
              host: 0.0.0.0
              port: ${PORT}
            cors:
              origin: https://backstage-pranab-mvp-e9gcgmasd5abgth5.centralindia-01.azurewebsites.net
              methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
              credentials: true

          auth:
            environment: production
            providers:
              guest:
                dangerouslyAllowOutsideDevelopment: true
          EOF

          echo "Checking for forbidden sqlite filename configuration..."
          if grep -R "filename:" backstage/app-config*.yaml; then
            echo "ERROR: filename-based SQLite config still exists."
            exit 1
          fi

      - name: Install dependencies
        working-directory: backstage
        run: |
          set -euo pipefail
          corepack enable
          yarn install --no-immutable

      - name: Type check
        working-directory: backstage
        run: yarn tsc

      - name: Build production backend and frontend
        working-directory: backstage
        env:
          NODE_ENV: production
        run: yarn build:backend

      - name: Prepare App Service runtime package
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY="${{ runner.temp }}/backstage-deploy"
          ZIP="${{ github.workspace }}/backstage-appservice.zip"

          rm -rf "$DEPLOY" "$ZIP"
          mkdir -p "$DEPLOY"

          cp backstage/package.json backstage/yarn.lock "$DEPLOY/"
          [ -f backstage/.yarnrc.yml ] && cp backstage/.yarnrc.yml "$DEPLOY/" || true
          [ -f backstage/backstage.json ] && cp backstage/backstage.json "$DEPLOY/" || true
          [ -d backstage/.yarn ] && cp -R backstage/.yarn "$DEPLOY/.yarn" || true

          tar -xzf backstage/packages/backend/dist/skeleton.tar.gz -C "$DEPLOY"

          cd "$DEPLOY"
          corepack enable
          yarn workspaces focus --all --production

          tar -xzf "${{ github.workspace }}/backstage/packages/backend/dist/bundle.tar.gz" -C "$DEPLOY"

          cp "${{ github.workspace }}/backstage/app-config.yaml" "$DEPLOY/app-config.yaml"
          cp "${{ github.workspace }}/backstage/app-config.production.yaml" "$DEPLOY/app-config.production.yaml"

          if [ -d "${{ github.workspace }}/backstage/examples" ]; then
            cp -R "${{ github.workspace }}/backstage/examples" "$DEPLOY/examples"
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start =
            'node packages/backend --config app-config.yaml --config app-config.production.yaml';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          echo "Final deployed production config:"
          cat app-config.production.yaml

          if grep -R "filename:" app-config*.yaml; then
            echo "ERROR: unsafe sqlite filename configuration made it into deployment."
            exit 1
          fi

          zip -qr "$ZIP" .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "${{ env.AZURE_WEBAPP_NAME }}"
          slot-name: "Production"
          package: backstage-appservice.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BB60165ACCCD4F3EB8AD10FD8D3BF808 }}
