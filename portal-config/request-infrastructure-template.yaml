apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-infrastructure
  title: Request Infrastructure
  description: Request a development, build, test, or sandbox infrastructure environment
  tags:
    - infrastructure
    - self-service
    - platform
spec:
  owner: guests
  type: infrastructure

  parameters:
    - title: Project Information
      required: [projectName, environment]
      properties:
        projectName:
          title: Project Name
          type: string
          description: Enter the project or application name
        environment:
          title: Environment
          type: string
          enum: [Development, Test, Build, Sandbox]

    - title: Choose Platform
      required: [platform]
      properties:
        platform:
          title: Cloud / Platform
          type: string
          enum: [Azure, AWS, Azure Local, Hyper-V]

    - title: Infrastructure Requirements
      required: [region, operatingSystem, vmSize, vmCount]
      properties:
        region:
          title: Region / Location
          type: string
          description: Example - Central India, West Europe
        operatingSystem:
          title: Operating System
          type: string
          enum:
            - Windows Server 2025
            - Windows Server 2022
            - Ubuntu 24.04
            - RHEL 9
        vmSize:
          title: VM Size
          type: string
          description: Example - Standard_D4s_v5
        vmCount:
          title: Number of VMs
          type: integer
          minimum: 1
          maximum: 20
          default: 1

    - title: Governance
      properties:
        costCenter:
          title: Cost Center
          type: string
        owner:
          title: Business / Technical Owner
          type: string
        lifetime:
          title: Environment Lifetime
          type: string
          enum: [8 Hours, 1 Day, 3 Days, 7 Days, 30 Days, Permanent]
        autoCleanup:
          title: Automatically delete environment after expiry
          type: boolean
          default: true

  steps:
    - id: validateRequest
      name: Validate Infrastructure Request
      action: debug:log
      input:
        message: |
          Infrastructure request received.
          Project: ${{ parameters.projectName }}
          Environment: ${{ parameters.environment }}
          Platform: ${{ parameters.platform }}
          Region: ${{ parameters.region }}
          OS: ${{ parameters.operatingSystem }}
          VM Size: ${{ parameters.vmSize }}
          VM Count: ${{ parameters.vmCount }}
          Cost Center: ${{ parameters.costCenter }}
          Owner: ${{ parameters.owner }}
          Lifetime: ${{ parameters.lifetime }}
          Auto Cleanup: ${{ parameters.autoCleanup }}

  output:
    text:
      - title: Request Status
        content: |
          Infrastructure request validated successfully.
          Project: ${{ parameters.projectName }}
          Platform: ${{ parameters.platform }}
          Environment: ${{ parameters.environment }}
          MVP mode: no real infrastructure is deployed yet.
